name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (web + worker)
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build web (demo data, no secrets needed)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
